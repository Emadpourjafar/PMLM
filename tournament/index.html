<!doctype html>
<html lang="fa" dir="rtl"><head>
<meta charset="utf-8"><meta name="author" content="Emad Pourjafar"><meta property="og:type" content="website"><meta property="og:locale" content="fa_IR"><meta property="og:title" content="مشاهده‌ی نتایج تورنومنت"><meta property="og:description" content="جدول رتبه‌بندی و نتایج زنده‌ی شرکت‌کنندگان"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="مشاهده‌ی نتایج تورنومنت"><meta name="twitter:description" content="جدول رتبه‌بندی و نتایج زنده‌ی شرکت‌کنندگان"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تورنومنت</title>
<style>
*{box-sizing:border-box}
:root{--g1:#4c1d95;--g2:#1e40af;--bg:#0b1020}
body{margin:0;min-height:100vh;font-family:Tahoma,Vazirmatn,sans-serif;color:#fff;direction:rtl;background:radial-gradient(circle at 15% 0,var(--g1) 0,transparent 45%),radial-gradient(circle at 95% 25%,var(--g2) 0,transparent 42%),var(--bg);background-attachment:fixed}
.wrap{max-width:720px;margin:auto;padding:20px 14px 40px}
.hero{text-align:center;padding:14px 0 4px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;background:#ffffff14;padding:4px 12px;border-radius:99px}
.live i{width:8px;height:8px;border-radius:50%;background:#22c55e;animation:p 1.4s infinite}
@keyframes p{to{box-shadow:0 0 0 10px #22c55e00}}
.live i{box-shadow:0 0 0 0 #22c55e99}
h1{font-size:2rem;margin:12px 0 4px;background:linear-gradient(90deg,#fde68a,#fb923c,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
.type{color:#c4b5fd;font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.st{background:#ffffff10;border:1px solid #ffffff1a;border-radius:16px;padding:12px 6px;text-align:center}
.st b{display:block;font-size:1.2rem;margin-top:2px}.st small{color:#a5b4fc;font-size:.72rem}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:8px;margin:28px 0 20px}
.pd{flex:1;max-width:210px;text-align:center;min-width:0}
.pd .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pd .ct{color:#c7d2fe;font-size:.78rem}
.pd .vl{font-weight:800;font-size:1.1rem;margin:2px 0 6px}
.pd .bar{border-radius:14px 14px 0 0;display:flex;justify-content:center;padding-top:10px;font-size:2rem;transform-origin:bottom;animation:grow .9s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes grow{from{transform:scaleY(0)}}
.r1 .bar{height:150px;background:linear-gradient(#fcd34d,#b45309);box-shadow:0 0 40px #fbbf2466}
.r2 .bar{height:115px;background:linear-gradient(#e2e8f0,#64748b)}
.r3 .bar{height:90px;background:linear-gradient(#fdba74,#9a3412)}
.r1 .vl{color:#fde68a}
.crown{font-size:1.8rem;animation:fl 2s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-6px)}}
.it{display:flex;align-items:center;gap:10px;background:#ffffff0d;border:1px solid #ffffff14;border-radius:14px;padding:10px 12px;margin-bottom:8px;animation:up .5s both}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
.rk{width:36px;height:36px;border-radius:50%;background:#ffffff18;display:grid;place-items:center;font-weight:800;flex:none}
.mid{flex:1;min-width:0}.mid .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mid small{color:#a5b4fc}
.pb{height:6px;background:#ffffff14;border-radius:9px;margin-top:6px;overflow:hidden}
.pb i{display:block;height:100%;background:linear-gradient(90deg,#818cf8,#f472b6);border-radius:9px;transition:width 1s}
.vl2{text-align:left;font-weight:800;font-size:1.05rem}.vl2 small{display:block;color:#fca5a5;font-weight:400;font-size:.7rem}
.mv{font-size:.72rem;margin-inline-start:6px}.up{color:#4ade80}.dn{color:#f87171}
.msg{text-align:center;padding:60px 10px;color:#c7d2fe}.msg div{font-size:3rem}
.cr{text-align:center;color:#818cf8;font-size:.62rem;padding:0 14px 22px;opacity:.7}
.foot{text-align:center;color:#818cf8;font-size:.75rem;margin-top:18px}
.timer{margin:14px auto 0;display:inline-block;background:#ffffff12;border:1px solid #ffffff22;border-radius:18px;padding:10px 24px}
.timer small{display:block;color:#a5b4fc;font-size:.72rem}
.timer b{font-size:2rem;letter-spacing:2px;direction:ltr;display:inline-block}
.timer.hot b{color:#f87171;animation:bl 1s infinite}@keyframes bl{50%{opacity:.45}}
.timer.end{color:#fde68a;font-weight:700;font-size:1.1rem}
</style></head>
<body><div class="wrap" id="app"></div>
<div class="cr"><span dir="ltr">Copyright: Emad Pourjafar</span></div>
<script src="common.js"></script>
<script>
const q = new URLSearchParams(location.search).get('t'), app = document.getElementById('app');
let first = true, sig = '', lastEnded = null, base = null, list = [], updated = '';
try { base = JSON.parse(localStorage.getItem('rk_' + q)); } catch (e) {}
const msg = (i, t) => { setConfetti(false); app.innerHTML = `<div class="msg"><div>${i}</div><h2>${t}</h2></div>`; };
const mv = (id, rank) => { if (!base || base[id] == null || base[id] === rank) return ''; const d = base[id] - rank; return `<span class="mv ${d > 0 ? 'up' : 'dn'}">${d > 0 ? '▲' : '▼'} ${nf(Math.abs(d))}</span>`; };
const gid = id => document.getElementById(id);
function tmBox(t) {
  if (!t.endsAt) return '';
  if (isEnded(t)) return '<div class="timer end">🏁 مسابقه به پایان رسید</div>';
  const r = t.endsAt - now();
  return `<div class="timer ${r < 60000 ? 'hot' : ''}"><small>⏳ زمان باقی‌مانده</small><b id="tm">${fmtT(r)}</b></div>`;
}
setInterval(() => {
  const t = list.find(x => x.id === q); if (!t || !t.endsAt) return;
  if (isEnded(t) !== lastEnded) return render();
  const e = gid('tm'); if (!e) return;
  e.textContent = fmtT(t.endsAt - now()); e.parentNode.classList.toggle('hot', t.endsAt - now() < 60000);
}, 1000);
function applyTheme(t) {
  const th = THEMES.find(x => x.id === t.theme) || THEMES[0], st = document.documentElement.style;
  st.setProperty('--g1', th.g1); st.setProperty('--g2', th.g2); st.setProperty('--bg', th.bg);
}
function endPill(t) {
  const e = new Date(t.endsAt);
  return `<span class="live">🏁 پایان مسابقه: ساعت ${e.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' })} · ${e.toLocaleDateString('fa-IR')}</span>`;
}
function render() {
  if (!q) return msg('🔗', 'لینک اختصاصی تورنومنت را از مدیر دریافت کنید');
  const t = list.find(x => x.id === q);
  if (!t) return msg('🔍', 'این تورنومنت پیدا نشد یا حذف شده است');
  const T = TYPES[t.type], rows = ranked(t.rows); lastEnded = isEnded(t); applyTheme(t);
  if (!rows.length) return msg('🔥', 'هنوز رکوردی ثبت نشده؛ مسابقه به‌زودی شروع می‌شود!');
  const top = rows.slice(0, 3), rest = rows.slice(3), max = rows[0].value || 1;
  const order = top.length === 3 ? [top[1], top[0], top[2]] : top.length === 2 ? [top[1], top[0]] : top;
  const pod = order.map(r => `<div class="pd r${r.rank}">${r.rank === 1 ? '<div class="crown">👑</div>' : ''}<div class="nm">${esc(r.name)}</div><div class="ct">${esc(r.city)}${mv(r.id, r.rank)}</div><div class="vl" data-n="${r.value}">${nf(r.value)}</div><div class="bar">${MEDAL[r.rank][0]}</div></div>`).join('');
  const lst = rest.map((r, i) => { const gap = rows[i + 2].value - r.value; return `<div class="it" style="animation-delay:${i * 60}ms"><div class="rk">${nf(r.rank)}</div><div class="mid"><div class="nm">${esc(r.name)}${mv(r.id, r.rank)}</div><small>${esc(r.city)}</small><div class="pb"><i style="width:${Math.max(3, r.value / max * 100)}%"></i></div></div><div class="vl2"><span data-n="${r.value}">${nf(r.value)}</span>${gap > 0 ? `<small>↑ ${nf(gap)} فاصله</small>` : ''}</div></div>`; }).join('');
  app.innerHTML = `<div class="hero">${lastEnded ? endPill(t) : '<span class="live"><i></i>زنده</span>'}<h1>${esc(t.name)}</h1><div class="type">${T.label}</div>${tmBox(t)}</div>
  <div class="stats"><div class="st"><small>${T.sum}</small><b data-n="${total(t.rows)}">${nf(total(t.rows))}</b></div><div class="st"><small>شرکت‌کنندگان</small><b>${nf(rows.length)}</b></div><div class="st"><small>بالاترین رکورد</small><b data-n="${max}">${nf(max)}</b></div></div>
  <div class="podium">${pod}</div><div>${lst}</div>
  <div class="foot">${updated ? 'آخرین به‌روزرسانی: ' + new Date(updated).toLocaleString('fa-IR') + ' · ' : ''}نتایج هر ۵ ثانیه تازه می‌شود</div>`;
  if (first) { first = false; if (!base) base = {}; countUp(); }
  setConfetti(lastEnded);
  try { localStorage.setItem('rk_' + q, JSON.stringify(Object.fromEntries(rows.map(r => [r.id, r.rank])))); } catch (e) {}
}
// ---- بمب کاغذ رنگی (تکرارشونده تا وقتی مسابقه تمام‌شده است) ----
const cv = document.createElement('canvas'), cx = cv.getContext('2d'), CC = ['#fbbf24', '#f472b6', '#818cf8', '#34d399', '#f87171', '#60a5fa', '#fde68a', '#ffffff'];
cv.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50';
document.body.appendChild(cv);
let parts = [], raf = 0, cTimer = 0;
const fit = () => { cv.width = innerWidth; cv.height = innerHeight; }; fit(); addEventListener('resize', fit);
function burst(x, y, ang, spread, n) {
  for (let i = 0; i < n; i++) {
    const a = ang + (Math.random() - .5) * spread, v = 7 + Math.random() * 10;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, w: 6 + Math.random() * 7, h: 4 + Math.random() * 5, r: Math.random() * 6.3, vr: (Math.random() - .5) * .4, c: CC[i % CC.length], l: 1, round: Math.random() < .25 });
  }
  if (!raf) raf = requestAnimationFrame(step);
}
function step() {
  cx.clearRect(0, 0, cv.width, cv.height);
  parts = parts.filter(p => p.l > 0 && p.y < cv.height + 30);
  for (const p of parts) {
    p.vy += .28; p.vx *= .992; p.vy *= .992; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.l -= .004;
    cx.save(); cx.globalAlpha = Math.min(1, p.l * 2); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c;
    if (p.round) { cx.beginPath(); cx.arc(0, 0, p.w / 2, 0, 6.3); cx.fill(); } else cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    cx.restore();
  }
  raf = parts.length ? requestAnimationFrame(step) : 0;
  if (!raf) cx.clearRect(0, 0, cv.width, cv.height);
}
function fire() {
  const e = document.querySelector('.timer.end'), b = e ? e.getBoundingClientRect() : null;
  burst(b ? b.left + b.width / 2 : innerWidth / 2, b ? b.top + b.height / 2 : innerHeight * .3, -Math.PI / 2, Math.PI * 1.15, 130);
  burst(0, innerHeight, -Math.PI / 3, .7, 70); burst(innerWidth, innerHeight, -2 * Math.PI / 3, .7, 70);
}
function setConfetti(on) {
  if (on && !cTimer) { setTimeout(fire, 150); cTimer = setInterval(fire, 3200); }
  else if (!on && cTimer) { clearInterval(cTimer); cTimer = 0; parts = []; }
}
function countUp() {
  document.querySelectorAll('[data-n]').forEach(el => {
    const to = +el.dataset.n, t0 = performance.now();
    (function f(t) { const p = Math.min(1, (t - t0) / 900); el.textContent = nf(Math.round(to * (1 - Math.pow(1 - p, 3)))); if (p < 1) requestAnimationFrame(f); })(t0);
  });
}
async function load() {
  try { const t0 = Date.now(), res = await fetch('data.json?t=' + t0, { cache: 'no-store' }), sk = skewFrom(res, t0, Date.now()); if (sk !== null) SKEW = sk; const d = await res.json(), ns = JSON.stringify(d); if (ns !== sig) { sig = ns; list = d.tournaments || []; updated = d.updated || ''; render(); } }
  catch (e) { if (!list.length) msg('⚠️', 'خطا در دریافت اطلاعات'); }
}
load(); setInterval(load, 5000);
</script></body></html>
