<!doctype html>
<html lang="fa" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مدیریت تورنومنت</title><link rel="stylesheet" href="../style.css"></head>
<body><div class="wrap">

<div id="login" class="card screen" style="max-width:380px;margin:40px auto;display:none">
  <h1>ورود مدیر</h1>
  <div class="row" style="flex-direction:column;align-items:stretch">
    <input id="tk" type="password" placeholder="توکن گیت‌هاب" dir="ltr">
    <input id="o" placeholder="نام کاربری گیت‌هاب (owner)" dir="ltr">
    <input id="r" placeholder="نام ریپو" dir="ltr">
    <input id="f" placeholder="مسیر فایل" dir="ltr" value="tournament/data.json">
    <button onclick="login()">ورود</button>
  </div>
  <div class="err" id="lerr"></div>
</div>

<div id="panel" style="display:none">
  <div class="screen">
    <div class="row" style="justify-content:space-between"><h1>⚙️ مدیریت تورنومنت</h1><span><span id="st" style="color:var(--mu)"></span> <button class="sec" onclick="logout()">خروج</button></span></div>
    <div class="card"><b>تورنومنت جدید</b>
      <div class="row" style="margin-top:8px">
        <input id="tn" placeholder="نام تورنومنت">
        <select id="tt"><option value="sales">روز فروش</option><option value="present">روز پرزنت</option></select>
        <button onclick="createT()">ایجاد</button>
      </div>
      <div class="err" id="terr"></div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div id="view"></div>
  </div>
  <div class="print-only" id="print"></div>
</div>

<dialog id="dlg">
  <b>حداکثر ۳ تورنومنت مجاز است.</b>
  <p>تورنومنت جدید جایگزین کدام شود؟ (اطلاعات آن حذف می‌شود)</p>
  <div id="opts"></div>
  <div class="row" style="margin-top:12px"><button onclick="confirmReplace()">جایگزین کن</button><button class="sec" onclick="dlg.close()">انصراف</button></div>
</dialog>
</div>

<script src="../common.js"></script>
<script>
const $ = id => document.getElementById(id), MAX = 3;
let list = [], cur = null, editId = null, pending = null, S = null, sha = null;
let saving = false, again = false, timer = null;

// ---- ارتباط با گیت‌هاب ----
const API = () => `https://api.github.com/repos/${S.owner}/${S.repo}/contents/${S.path}`;
const HD = () => ({ Authorization: 'Bearer ' + S.token, Accept: 'application/vnd.github+json' });
async function getFile() {
  const r = await fetch(API() + '?t=' + Date.now(), { headers: HD(), cache: 'no-store' });
  if (!r.ok) throw new Error(r.status === 401 ? 'توکن نامعتبر است' : r.status === 404 ? 'فایل یا ریپو پیدا نشد (مسیر را بررسی کنید)' : 'خطا ' + r.status);
  const j = await r.json(); sha = j.sha;
  const bin = atob(j.content.replace(/\n/g, ''));
  return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
}
async function putFile() {
  const body = JSON.stringify({ tournaments: list, updated: new Date().toISOString() }, null, 1);
  let bin = ''; new TextEncoder().encode(body).forEach(b => bin += String.fromCharCode(b));
  const r = await fetch(API(), { method: 'PUT', headers: { ...HD(), 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: 'update tournaments', content: btoa(bin), sha }) });
  if (!r.ok) throw new Error(r.status === 409 || r.status === 422 ? 'تداخل ذخیره؛ صفحه را رفرش کنید' : r.status === 403 || r.status === 404 ? 'دسترسی نوشتن ندارد' : 'خطا ' + r.status);
  sha = (await r.json()).content.sha;
}
function queueSave() { $('st').textContent = 'در انتظار ذخیره…'; clearTimeout(timer); timer = setTimeout(persist, 800); }
async function persist() {
  if (saving) { again = true; return; }
  saving = true; $('st').textContent = 'در حال ذخیره…';
  try { do { again = false; await putFile(); } while (again); $('st').textContent = 'ذخیره شد ✓'; }
  catch (e) { $('st').textContent = '⚠️ ' + e.message; }
  saving = false;
}
const commit = () => { render(); queueSave(); };

// ---- ورود ----
function enter() { $('login').style.display = 'none'; $('panel').style.display = 'block'; render(); }
async function login(cfg) {
  S = cfg || { token: $('tk').value.trim(), owner: $('o').value.trim(), repo: $('r').value.trim(), path: $('f').value.trim() || 'tournament/data.json' };
  $('lerr').textContent = '';
  try {
    const rp = await fetch(`https://api.github.com/repos/${S.owner}/${S.repo}`, { headers: HD() });
    if (!rp.ok) throw new Error('ریپو پیدا نشد یا توکن نامعتبر است');
    if (!(await rp.json()).permissions?.push) throw new Error('این توکن اجازه‌ی نوشتن ندارد');
    list = (await getFile()).tournaments || [];
    localStorage.setItem('tcfg', JSON.stringify(S)); enter();
  } catch (e) { $('login').style.display = 'block'; $('lerr').textContent = e.message; }
}
function logout() { localStorage.removeItem('tcfg'); location.reload(); }
(function init() {
  const h = location.hostname, seg = location.pathname.split('/')[1];
  if (h.endsWith('.github.io')) { $('o').value = h.split('.')[0]; $('r').value = seg === 'tournament' ? h : seg; }
  let c = null; try { c = JSON.parse(localStorage.getItem('tcfg')); } catch (e) {}
  if (c && c.token) login(c); else $('login').style.display = 'block';
})();

// ---- تورنومنت ----
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function createT() {
  const name = $('tn').value.trim(); $('terr').textContent = '';
  if (!name) { $('terr').textContent = 'نام تورنومنت را وارد کنید'; return; }
  pending = { id: uid(), name, type: $('tt').value, rows: [] };
  if (list.length < MAX) return saveNew();
  $('opts').innerHTML = list.map((t, i) => `<label><input type="radio" name="rep" value="${t.id}" ${i ? '' : 'checked'}> ${esc(t.name)} <span class="badge">${TYPES[t.type].label}</span></label>`).join('');
  $('dlg').showModal();
}
function saveNew(replaceId) {
  if (replaceId) list = list.filter(t => t.id !== replaceId);
  list.push(pending); cur = pending.id; pending = null; $('tn').value = ''; commit();
}
function confirmReplace() { const id = document.querySelector('input[name=rep]:checked').value; $('dlg').close(); saveNew(id); }
function delT(id) { if (confirm('این تورنومنت و همه‌ی رکوردهایش حذف شود؟')) { list = list.filter(t => t.id !== id); commit(); } }

// ---- رکوردها ----
const curT = () => list.find(t => t.id === cur);
function addRow() {
  const t = curT(), name = $('rn').value.trim(), city = $('rc').value.trim(), value = Math.max(0, parseInt($('rv').value) || 0);
  if (!name) { $('rerr').textContent = 'نام را وارد کنید'; return; }
  if (editId) Object.assign(t.rows.find(x => x.id === editId), { name, city, value });
  else t.rows.push({ id: uid(), name, city, value });
  editId = null; commit();
}
function editRow(id) { const r = curT().rows.find(x => x.id === id); editId = id; render(); $('rn').value = r.name; $('rc').value = r.city; $('rv').value = r.value; $('rn').focus(); }
function cancelEdit() { editId = null; render(); }
function delRow(id) { if (confirm('این رکورد حذف شود؟')) { const t = curT(); t.rows = t.rows.filter(r => r.id !== id); commit(); } }
function setVal(id, v) { curT().rows.find(r => r.id === id).value = Math.max(0, parseInt(v) || 0); commit(); }
const step = (id, d) => setVal(id, curT().rows.find(x => x.id === id).value + d);

function act(r, buttons) {
  const t = curT();
  if (!buttons) return t.type === 'present'
    ? `<span class="step"><button class="sec" onclick="step('${r.id}',-1)">−</button><input type="number" min="0" value="${r.value}" onchange="setVal('${r.id}',this.value)"><button onclick="step('${r.id}',1)">+</button></span>`
    : nf(r.value);
  return `<button class="sm sec" onclick="editRow('${r.id}')">ویرایش</button> <button class="sm del" onclick="delRow('${r.id}')">حذف</button>`;
}

function render() {
  if (!list.length) { $('tabs').innerHTML = ''; $('view').innerHTML = '<p class="empty">هنوز تورنومنتی نساخته‌اید.</p>'; $('print').innerHTML = ''; return; }
  if (!list.find(t => t.id === cur)) cur = list[0].id;
  $('tabs').innerHTML = list.map(t => `<button class="tab ${t.id === cur ? 'on' : ''}" onclick="cur='${t.id}';editId=null;render()">${esc(t.name)}</button>`).join('') + `<span style="color:var(--mu);align-self:center">${nf(list.length)} از ${nf(MAX)}</span>`;
  const t = curT(), T = TYPES[t.type];
  $('view').innerHTML = `<div class="card">
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(t.name)}<span class="badge">${T.label}</span></h2>
      <span><button class="sm" onclick="window.print()">📄 خروجی PDF</button> <button class="sm del" onclick="delT('${t.id}')">حذف تورنومنت</button></span></div>
    <div class="stat">${T.sum}:<b>${nf(total(t.rows))}</b></div>
    <div class="row" style="margin:10px 0"><input id="rn" placeholder="نام و نام‌خانوادگی"><input id="rc" placeholder="شهر">
      <input id="rv" type="number" min="0" placeholder="${T.col}" onkeydown="if(event.key==='Enter')addRow()">
      <button onclick="addRow()">${editId ? 'ذخیره' : 'افزودن'}</button>${editId ? '<button class="sec" onclick="cancelEdit()">انصراف</button>' : ''}</div>
    <div class="err" id="rerr"></div>
    <div class="scroll">${tableHTML(t, act)}</div></div>`;
  $('print').innerHTML = `<h1>${esc(t.name)} — ${T.label}</h1><p>تاریخ: ${new Date().toLocaleDateString('fa-IR')}</p>` + tableHTML(t);
}
</script></body></html>
